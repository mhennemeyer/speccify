[project]
name = "speccify-registry"
version = "0.0.0"
description = "Speccify registry backend — Django app for publish/search/yank of spec versions."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Marc Hennemeyer" }]
dependencies = [
    "speccify-core",
    "django>=5.1,<6.0",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "django-otp>=1.5",
    "qrcode>=8.0",
    "argon2-cffi>=23.1",
]

[project.scripts]
speccify-registry-manage = "speccify_registry.manage:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "responses>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speccify_registry"]
