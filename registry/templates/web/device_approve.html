{% extends "web/base.html" %}
{% block title %}Approve CLI — Speccify Registry{% endblock %}
{% block content %}
<h1>Approve CLI login</h1>
<p>Enter the device code shown by <code>speccify login</code> and confirm to mint a new API token for the CLI.</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" name="approve">Approve</button>
  <button type="submit" name="deny" value="deny" formnovalidate
          onclick="this.form.action.value='deny'">Deny</button>
</form>
{% endblock %}
