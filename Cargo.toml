# Rust-Workspace für den Infrastruktur-Workstream „Rust-Neustart"
# (.agent/plans/rust-neustart-toolkit-mcps.md): Exec-MCP + Discovery-MCP.
# Die Spec-Engine (core/, cli/, mcp/) und das Composer-Backend bleiben Python.

[workspace]
resolver = "2"
members = [
    "crates/mcp-core",
    "crates/exec-mcp",
    "crates/discovery-mcp",
    "crates/parallels-mcp",
    "crates/toolbox",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mhennemeyer/speccify"
