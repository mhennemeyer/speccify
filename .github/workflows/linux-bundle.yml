name: Linux bundle (test build)

# Baut die Linux-Pakete (AppImage, deb, rpm) OHNE Release — als Artefakte
# des Laufs. Zum Ausprobieren des Linux-Builds ohne Tag (IDE-Plan, BO
# 2026-09-08) und für einen Testlauf vor dem ersten Linux-Release. Die
# Schritte spiegeln release-linux in release.yml.

on:
  workflow_dispatch:

jobs:
  bundle:
    name: Linux (${{ matrix.arch }}) bundles as artifacts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          # ARM64 für Linux-VMs auf Apple-Silicon-Macs (BO-Test 2026-09-09);
          # GitHub stellt ARM-Runner für öffentliche Repos kostenlos.
          - arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev patchelf build-essential curl wget file \
            libfuse2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
            apps/desktop/src-tauri

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: |
          uv sync --all-packages
          pnpm install --frozen-lockfile

      - name: Build sidecars (MCP binaries + pinned uv)
        run: ./scripts/build_sidecars.sh

      - name: Build engine payload (wheels + skills)
        run: ./scripts/build_engine_payload.sh

      - name: Build bundles
        run: pnpm --filter speccify-desktop tauri build --bundles appimage,deb,rpm

      - name: List bundles
        run: find target/release/bundle -maxdepth 3 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec ls -la {} \;

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: speccify-linux-${{ matrix.arch }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error
