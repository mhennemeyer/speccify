name: Deploy site

# Publishes apps/marketing/ to GitHub Pages on every push to main.
#
# The build itself (drift checks, link check, markdown lint) lives in
# docs.yml and gates pull requests. This workflow only ships what is already
# on main, so a broken site cannot be deployed by a green PR that was never
# merged.

on:
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - "docs/**"
      - "scripts/sync_docs_to_site.py"
      - "scripts/gen_cli_docs.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes an older one, but never
# cancels a deployment that is already writing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-packages

      # The site's docs pages are generated from docs/ and from `speccify --help`.
      # Deploying without this check would publish a site that disagrees with
      # the repository it documents.
      - name: Drift check — docs and CLI reference
        run: |
          uv run python scripts/sync_docs_to_site.py --check
          uv run python scripts/gen_cli_docs.py --check

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter speccify-marketing build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/marketing/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
