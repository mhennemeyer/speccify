name: Deploy site

# Publishes apps/marketing/ to GitHub Pages on every push to main.
#
# The build itself (drift checks, link check, markdown lint) lives in
# docs.yml and gates pull requests. This workflow only ships what is already
# on main, so a broken site cannot be deployed by a green PR that was never
# merged.

# Run it by hand from the Actions tab ("Run workflow") when you need to
# publish without a matching change — the path filters below are narrow
# on purpose, so unrelated pushes do not redeploy.

on:
  push:
    branches: [main, specs]
    paths:
      - "apps/marketing/**"
      - "docs/**"
      - "scripts/sync_docs_to_site.py"
      - "scripts/gen_cli_docs.py"
      - ".github/workflows/pages.yml"
      - "core/src/speccify_core/board.py"
      # Spec 031: the team board is rebuilt on every push to the `specs`
      # branch, whose files live at the root (`<NNN-slug>/SPEC.md`).
      - "*/SPEC.md"
      - "*/history.jsonl"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes an older one, but never
# cancels a deployment that is already writing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The site is always built from main, whichever branch triggered the run.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-packages

      # The site's docs pages are generated from docs/ and from `speccify --help`.
      # Deploying without this check would publish a site that disagrees with
      # the repository it documents.
      - name: Drift check — docs and CLI reference
        run: |
          uv run python scripts/sync_docs_to_site.py --check
          uv run python scripts/gen_cli_docs.py --check

      # Spec 031: team board from the shared spec register (branch `specs`).
      # Read-only; a missing branch yields no page, never a failed deploy.
      - name: Team board from the specs branch
        run: |
          if git fetch --depth=1 origin specs 2>/dev/null; then
            rm -rf /tmp/specs && git worktree add /tmp/specs FETCH_HEAD
            uv run speccify board --specs /tmp/specs --out apps/marketing/public/board/index.html \
              --title Speccify --source "specs@$(git -C /tmp/specs rev-parse --short HEAD)"
          else
            echo "no specs branch — board skipped"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PUBLIC_RELEASE_SIGNED is a repository *variable* (not a secret): set it
      # to "true" once the releases are actually signed and notarized, and the
      # download page drops its Gatekeeper/SmartScreen warning boxes. Unset or
      # anything else means the honest default: warn.
      - name: Build
        env:
          PUBLIC_RELEASE_SIGNED: ${{ vars.PUBLIC_RELEASE_SIGNED }}
        run: pnpm --filter speccify-marketing build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/marketing/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
