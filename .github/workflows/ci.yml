name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Phase 5a: Conformance-Jobs (Build-Smoke gegen echte Toolchains) sind teuer
# und laufen nur bei Touch der relevanten Codegen-/Conformance-Sources, per
# nightly Cron und manuell über `workflow_dispatch`. Das spart Minutes auf
# unrelated PRs (z. B. nur docs).

jobs:
  smoke:
    name: lint + tests + playbook smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy core/src cli/src

      - name: Pytest
        run: uv run pytest

      - name: speccify lint + check the shipped skills
        run: |
          uv run speccify lint skills/
          uv run speccify check skills/

      - name: speccify end-to-end smoke (init + add + lock + verify + pull + show)
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          BIN="${{ github.workspace }}/.venv/bin/speccify"
          LIB="${{ github.workspace }}/skills"
          "$BIN" init --project "$WORK"
          "$BIN" add @speccify/macos-notarize-tauri --project "$WORK" --library "$LIB"
          "$BIN" verify --project "$WORK" --library "$LIB"
          "$BIN" pull --project "$WORK" --library "$LIB" --out "$WORK/out"
          test -f "$WORK/out/macos-notarize-tauri/tools/verify-signatures/reference.sh"
          "$BIN" show @speccify/macos-notarize-tauri --project "$WORK" --library "$LIB" --json > /dev/null

      - name: speccify-mcp smoke (stdio, offline)
        run: uv run python scripts/mcp_smoke.py

  web-backend:
    name: apps/web backend (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Pytest (apps/web backend)
        run: uv run pytest apps/web/backend/tests -v

  composer:
    name: viewer build (vite spa)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
          run_install: false

      - name: Install dependencies (frozen lockfile, workspace root)
        run: pnpm install --frozen-lockfile

      - name: Typecheck + build (static export, Tauri-ready)
        run: pnpm --filter speccify-composer build

  composer-e2e:
    name: viewer ui smoke (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Sync workspace (backend for the UI smoke)
        run: uv sync --all-packages

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
          run_install: false

      - name: Install dependencies (frozen lockfile, workspace root)
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-composer-${{ runner.os }}-1.62.1

      # `--with-deps` on Ubuntu 24.04 needs a Playwright that knows the
      # time_t transition: noble renamed libasound2 to libasound2t64, and
      # older releases still ask for the old name and fail with apt code 100.
      - name: Install Playwright Chromium
        run: pnpm --filter speccify-composer exec playwright install --with-deps chromium

      - name: Viewer UI smoke (backend + vite + chromium)
        run: pnpm --filter speccify-composer e2e

  rust:
    name: rust workspace (exec-mcp + discovery-mcp)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rustup liest rust-toolchain.toml (gepinnte Version + rustfmt/clippy).
      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      # Das Tauri-Crate (apps/desktop/src-tauri) ist ausgeschlossen: es
      # bräuchte webkit2gtk-Systemdeps auf Linux und wird nativ auf macOS
      # gebaut (Zielplattform, siehe apps/desktop/README.md).
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --exclude speccify-desktop --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --exclude speccify-desktop

      - name: Test
        run: cargo test --workspace --exclude speccify-desktop

  desktop-frontend:
    name: apps/desktop frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
          run_install: false

      - name: Install dependencies (frozen lockfile, workspace root)
        run: pnpm install --frozen-lockfile

      - name: Typecheck + build (Tauri app frontend)
        run: pnpm --filter speccify-desktop build
