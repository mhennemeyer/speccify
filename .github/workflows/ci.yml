name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Phase 5a: Conformance-Jobs (Build-Smoke gegen echte Toolchains) sind teuer
# und laufen nur bei Touch der relevanten Codegen-/Conformance-Sources, per
# nightly Cron und manuell über `workflow_dispatch`. Das spart Minutes auf
# unrelated PRs (z. B. nur docs).

jobs:
  smoke:
    name: lint + tests + spec-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy core/src cli/src

      - name: Pytest
        run: uv run pytest

      - name: speccify lint reference specs
        run: uv run speccify lint specs/*.speccify.yaml

      - name: speccify end-to-end smoke (lock + pull + verify + conformance, offline)
        working-directory: example-project
        run: |
          uv run speccify lock
          uv run speccify pull --offline --out ./out
          uv run speccify verify --offline --out ./out
          uv run speccify conformance

      - name: speccify init + add + pull + verify smoke (offline)
        env:
          REPO_ROOT: ${{ github.workspace }}
          SPECCIFY: ${{ github.workspace }}/.venv/bin/speccify
          REGISTRY: ${{ github.workspace }}/registry-fixtures
          CACHE_DIR: ${{ github.workspace }}/tests/fixtures/llm-cache
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d)"
          pushd "$SMOKE_DIR" >/dev/null
          "$SPECCIFY" init smoke-app --target react
          cd smoke-app
          "$SPECCIFY" add @org/button --registry "$REGISTRY"
          "$SPECCIFY" lock --registry "$REGISTRY"
          "$SPECCIFY" pull --offline --registry "$REGISTRY" \
            --cache-dir "$CACHE_DIR" --out ./out
          "$SPECCIFY" verify --offline --registry "$REGISTRY" \
            --cache-dir "$CACHE_DIR" --out ./out
          popd >/dev/null
          rm -rf "$SMOKE_DIR"

      - name: speccify-mcp smoke (stdio, offline)
        run: uv run python scripts/mcp_smoke.py

  web-backend:
    name: apps/web backend (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Pytest (apps/web backend, inkl. Cross-Consistency CLI ↔ MCP ↔ Web)
        run: uv run pytest apps/web/backend/tests -v

  web-frontend:
    name: apps/web frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/frontend/.nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
          run_install: false

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  composer:
    name: apps/composer build (vite spa)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
          run_install: false

      - name: Install dependencies (frozen lockfile, workspace root)
        run: pnpm install --frozen-lockfile

      - name: Typecheck + Build (statischer Export, Tauri-2-fähig)
        run: pnpm --filter speccify-composer build

  composer-e2e:
    name: apps/composer ui smoke (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Sync workspace (Backend für den UI-Smoke)
        run: uv sync --all-packages

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
          run_install: false

      - name: Install dependencies (frozen lockfile, workspace root)
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-composer-${{ runner.os }}-1.44.0

      - name: Install Playwright Chromium
        run: pnpm --filter speccify-composer exec playwright install --with-deps chromium

      - name: Composer UI smoke (backend + vite + chromium)
        run: pnpm --filter speccify-composer e2e

  app-build:
    name: speccify build smoke (vite + browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
          run_install: false

      # Der Smoke verlinkt apps/composer/node_modules ins generierte Projekt —
      # dort stehen exakt die Pakete, die das Scaffold pinnt.
      - name: Install dependencies (frozen lockfile, workspace root)
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-composer-${{ runner.os }}-1.44.0

      - name: Install Playwright Chromium
        run: pnpm --filter speccify-composer exec playwright install --with-deps chromium

      - name: Build the demo app and drive it in a browser
        run: uv run pytest tests/test_app_build_smoke.py -m app_build -v

  rust:
    name: rust workspace (exec-mcp + discovery-mcp)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rustup liest rust-toolchain.toml (gepinnte Version + rustfmt/clippy).
      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      # Das Tauri-Crate (apps/desktop/src-tauri) ist ausgeschlossen: es
      # bräuchte webkit2gtk-Systemdeps auf Linux und wird nativ auf macOS
      # gebaut (Zielplattform, siehe apps/desktop/README.md).
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --exclude speccify-desktop --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --exclude speccify-desktop

      - name: Test
        run: cargo test --workspace --exclude speccify-desktop

  desktop-frontend:
    name: apps/desktop frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
          run_install: false

      - name: Install dependencies (frozen lockfile, workspace root)
        run: pnpm install --frozen-lockfile

      - name: Typecheck + Build (Vite-Frontend der Tauri-App)
        run: pnpm --filter speccify-desktop build
