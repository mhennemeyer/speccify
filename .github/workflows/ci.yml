name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Phase 5a: Conformance-Jobs (Build-Smoke gegen echte Toolchains) sind teuer
# und laufen nur bei Touch der relevanten Codegen-/Conformance-Sources, per
# nightly Cron und manuell über `workflow_dispatch`. Das spart Minutes auf
# unrelated PRs (z. B. nur docs/registry).

jobs:
  smoke:
    name: lint + tests + spec-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy core/src cli/src

      - name: Pytest
        run: uv run pytest

      - name: speccify lint reference specs
        run: uv run speccify lint specs/*.speccify.yaml

      - name: speccify end-to-end smoke (lock + pull + verify + conformance, offline)
        working-directory: example-project
        run: |
          uv run speccify lock
          uv run speccify pull --offline --out ./out
          uv run speccify verify --offline --out ./out
          uv run speccify conformance

      - name: speccify init + add + pull + verify smoke (offline)
        env:
          REPO_ROOT: ${{ github.workspace }}
          SPECCIFY: ${{ github.workspace }}/.venv/bin/speccify
          REGISTRY: ${{ github.workspace }}/registry-fixtures
          CACHE_DIR: ${{ github.workspace }}/tests/fixtures/llm-cache
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d)"
          pushd "$SMOKE_DIR" >/dev/null
          "$SPECCIFY" init smoke-app --target react
          cd smoke-app
          "$SPECCIFY" add @org/button --registry "$REGISTRY"
          "$SPECCIFY" lock --registry "$REGISTRY"
          "$SPECCIFY" pull --offline --registry "$REGISTRY" \
            --cache-dir "$CACHE_DIR" --out ./out
          "$SPECCIFY" verify --offline --registry "$REGISTRY" \
            --cache-dir "$CACHE_DIR" --out ./out
          popd >/dev/null
          rm -rf "$SMOKE_DIR"

      - name: speccify-mcp smoke (stdio, offline)
        run: uv run python scripts/mcp_smoke.py

  web-backend:
    name: apps/web backend (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Pytest (apps/web backend, inkl. Cross-Consistency CLI ↔ MCP ↔ Web)
        run: uv run pytest apps/web/backend/tests -v

  registry-backend:
    name: registry backend (django + postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      # Phase 2 Stage 7: CI läuft gegen einen echten Postgres-Service-Container,
      # damit der Postgres-Pfad (DATABASE_URL) abgedeckt ist. Lokale Dev-Runs
      # fallen weiterhin auf in-memory SQLite zurück, wenn `DATABASE_URL`
      # nicht gesetzt ist (siehe `speccify_registry.settings._database_from_env`).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: speccify_registry
          POSTGRES_USER: speccify
          POSTGRES_PASSWORD: speccify
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U speccify -d speccify_registry"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://speccify:speccify@localhost:5432/speccify_registry
      POSTGRES_DB: speccify_registry
      POSTGRES_USER: speccify
      POSTGRES_PASSWORD: speccify
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Pytest (registry, Django + pytest-django, Postgres service)
        # `-c registry/pytest.ini` is required so pytest picks up the
        # registry-local config (DJANGO_SETTINGS_MODULE, pythonpath=src)
        # instead of the workspace-wide pyproject pytest options.
        # `DATABASE_URL` schaltet `settings._database_from_env` auf den
        # Postgres-Service-Container um (sonst SQLite-Fallback wie lokal).
        run: uv run pytest -c registry/pytest.ini registry/ -v

  web-frontend:
    name: apps/web frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/frontend/.nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
          run_install: false

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
