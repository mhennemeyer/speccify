name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Phase 5a: Conformance-Jobs (Build-Smoke gegen echte Toolchains) sind teuer
# und laufen nur bei Touch der relevanten Codegen-/Conformance-Sources, per
# nightly Cron und manuell über `workflow_dispatch`. Das spart Minutes auf
# unrelated PRs (z. B. nur docs).

jobs:
  smoke:
    name: lint + tests + playbook smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy core/src cli/src

      - name: Pytest
        run: uv run pytest

      - name: speccify lint + check the shipped skills
        run: |
          uv run speccify lint skills/
          uv run speccify check skills/

      - name: speccify end-to-end smoke (init + add + lock + verify + pull + expand + show)
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          BIN="${{ github.workspace }}/.venv/bin/speccify"
          LIB="${{ github.workspace }}/skills"
          "$BIN" init --project "$WORK"
          "$BIN" add @speccify/macos-notarize-tauri --project "$WORK" --library "$LIB"
          "$BIN" verify --project "$WORK" --library "$LIB"
          "$BIN" pull --project "$WORK" --library "$LIB" --out "$WORK/out"
          test -f "$WORK/out/macos-notarize-tauri/tools/verify-signatures/reference.sh"
          "$BIN" expand --project "$WORK" --library "$LIB" --platform linux
          test -f "$WORK/.agent/skills/macos-notarize-tauri/SKILL.md"
          test -f "$WORK/.agent/tools/verify-signatures/TOOL.md"
          test -L "$WORK/.claude/skills"
          "$BIN" check "$WORK/.agent/skills"
          "$BIN" show @speccify/macos-notarize-tauri --project "$WORK" --library "$LIB" --json > /dev/null

      - name: speccify-mcp smoke (stdio, offline)
        run: uv run python scripts/mcp_smoke.py

  web-backend:
    name: apps/web backend (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Pytest (apps/web backend)
        run: uv run pytest apps/web/backend/tests -v

  rust:
    name: rust workspace (exec-mcp + discovery-mcp)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rustup liest rust-toolchain.toml (gepinnte Version + rustfmt/clippy).
      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      # Das Tauri-Crate (apps/desktop/src-tauri) ist ausgeschlossen: es
      # bräuchte webkit2gtk-Systemdeps auf Linux und wird nativ auf macOS
      # gebaut (Zielplattform, siehe apps/desktop/README.md).
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --exclude speccify-desktop --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --exclude speccify-desktop

      - name: Test
        run: cargo test --workspace --exclude speccify-desktop

  # Windows-Referenz für den Projektfenster-Plan (projektfenster.md, P2):
  # ohne eigene Windows-Maschine im Alltag ist dieser Job das Netz gegen
  # Regressionen wie #[cfg(windows)]-Pfade, HOME/USERPROFILE und Verbatim-
  # Pfade. x64 deckt zusätzlich die Nicht-ARM-Seite ab (VM ist ARM64).
  desktop-windows:
    name: apps/desktop windows (typecheck + build + cargo test)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies (frozen lockfile, workspace root)
        run: pnpm install --frozen-lockfile

      - name: Typecheck + build (Tauri app frontend)
        run: pnpm --filter speccify-desktop build

      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install uv (Sidecar-Quelle)
        uses: astral-sh/setup-uv@v3

      # tauri_build::build() verlangt die externalBin- und resources-Einträge
      # aus tauri.conf.json schon bei cargo check/test — beide Ordner sind
      # gitignored (scripts/build_sidecars.sh füllt sie lokal), also hier
      # selbst herstellen: MCPs bauen, uv vom Runner nehmen, resources-Glob
      # mit einem Platzhalter füttern (echte Payload ist Bundling, nicht CI).
      - name: Build sidecars (debug)
        shell: pwsh
        run: |
          cargo build -p speccify-exec-mcp -p speccify-discovery-mcp -p speccify-parallels-mcp
          $triple = (rustc -vV | Select-String '^host: (.+)$').Matches.Groups[1].Value
          $bin = "apps/desktop/src-tauri/binaries"
          New-Item -ItemType Directory -Force $bin | Out-Null
          foreach ($name in "speccify-exec-mcp", "speccify-discovery-mcp", "speccify-parallels-mcp") {
            Copy-Item "target/debug/$name.exe" "$bin/$name-$triple.exe"
          }
          Copy-Item (Get-Command uv).Source "$bin/speccify-uv-$triple.exe"
          New-Item -ItemType Directory -Force "apps/desktop/src-tauri/resources" | Out-Null
          Set-Content "apps/desktop/src-tauri/resources/ci-placeholder.txt" "CI: erfuellt nur den resources-Glob."

      - name: Cargo test (speccify-desktop, windows)
        run: cargo test -p speccify-desktop

  # Linux-Referenz (IDE-Plan, BO 2026-09-08): das Tauri-Crate wurde bis
  # dahin nie auf Linux kompiliert — der rust-workspace-Job schließt es
  # wegen der WebKitGTK-Systemdeps aus. Dieser Job installiert sie und ist
  # damit das Netz für die Linux-Releases (release.yml, release-linux).
  desktop-linux:
    name: apps/desktop linux (typecheck + build + cargo test)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies (frozen lockfile, workspace root)
        run: pnpm install --frozen-lockfile

      - name: Typecheck + build (Tauri app frontend)
        run: pnpm --filter speccify-desktop build

      # WebKitGTK 4.1 + GTK 3 + Appindicator + rsvg: was Tauri 2 auf Linux
      # zum Kompilieren braucht (docs/release.md, Abschnitt Linux).
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev patchelf build-essential curl wget file xdg-utils

      - name: Install pinned toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install uv (Sidecar-Quelle)
        uses: astral-sh/setup-uv@v3

      # Wie im Windows-Job: externalBin/resources müssen bei cargo test schon
      # existieren — Debug-Sidecars, uv vom Runner, Platzhalter-Resource.
      - name: Build sidecars (debug)
        run: |
          cargo build -p speccify-exec-mcp -p speccify-discovery-mcp -p speccify-parallels-mcp
          triple="$(rustc -vV | awk '/^host: /{print $2}')"
          bin=apps/desktop/src-tauri/binaries
          mkdir -p "$bin" apps/desktop/src-tauri/resources
          for name in speccify-exec-mcp speccify-discovery-mcp speccify-parallels-mcp; do
            cp "target/debug/$name" "$bin/$name-$triple"
          done
          cp "$(command -v uv)" "$bin/speccify-uv-$triple"
          echo "CI: erfuellt nur den resources-Glob." > apps/desktop/src-tauri/resources/ci-placeholder.txt

      - name: Cargo test (speccify-desktop, linux)
        run: cargo test -p speccify-desktop

  desktop-frontend:
    name: apps/desktop frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies (frozen lockfile, workspace root)
        run: pnpm install --frozen-lockfile

      - name: Typecheck + build (Tauri app frontend)
        run: pnpm --filter speccify-desktop build
