schema_version: 1
id: "@org/login-screen"
version: 0.1.0
kind: screen
title: Login-Screen mit OTP
summary: >
  Login-Screen per E-Mail/Telefon und 6-stelligem OTP. Inkludiert Resend-Logik,
  Lockout nach 5 Fehlversuchen und Accessibility AA. Orientiert sich am
  Master-Plan-Beispiel "@org/login-with-otp".
authors: [marc@speccify.io]
license: MIT

uses:
  - "@org/button@^0.1.1"
  - "@org/http-api-client@^0.1"

api:
  props:
    - name: identifier
      type: string
      constraints: ["email | e164-phone"]
    - name: prefill_identifier
      type: string
  outputs:
    - name: session
      type: "object{token: string, expires_at: string}"
  events:
    - name: otp_sent
      payload:
        channel: "enum[email, sms]"
    - name: otp_resent
    - name: login_succeeded
      payload:
        user_id: string
    - name: login_failed
      payload:
        reason: "enum[invalid_otp, expired, locked, network]"

acceptance:
  - given: Nutzer gibt gültige E-Mail ein
    when: Submit gedrückt
    then: otp_sent emittiert, OTP-Eingabe erscheint binnen 300ms
  - given: 5 falsche OTPs in Folge
    then: login_failed mit reason=locked; 15 Minuten Sperre
  - given: OTP ist älter als 10 Minuten
    when: Nutzer bestätigt
    then: login_failed mit reason=expired
  - given: gültiger OTP
    then: login_succeeded mit user_id; session-Output ist gesetzt

ux:
  references:
    - figma://file/abc123?node=4:12
    - ./screenshots/login-happy-path.png
    - ./screenshots/login-error-locked.png
    - ./screenshots/login-otp-expired.png
  a11y: WCAG-2.2-AA
  i18n: required

non_functional:
  performance: "TTI < 2s auf 3G"
  security:
    - "keine OTPs im LocalStorage"
    - "Rate-Limit serverseitig"
    - "OTP-Anzeige niemals geloggt"

conformance:
  fixtures: ./fixtures/*.json
