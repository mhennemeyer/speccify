schema_version: 1
id: "@org/demo-app"
version: 0.1.0
kind: app
title: Speccify Demo-App
summary: >
  Beispiel-App aus den Referenz-Specs (Phase P4): vier Screens — Anmelden,
  Suchen, Notiz, Kontakt — verdrahtet über Navigation und einen Datenfluss
  zwischen zwei Screens. Baut mit `speccify build --mocks` sofort lauffähig.
authors: [marc@speccify.io]
license: MIT

app:
  routes:
    - path: /
      node: login
      title: Anmelden
    - path: /suche
      node: search
      title: Suche
    - path: /notiz
      node: note
      title: Notiz
    - path: /kontakt
      node: contact
      title: Kontakt
  theme:
    tokens:
      color_primary: "#0f766e"
      color_text: "#0f172a"
      radius_md: 8px
  env:
    - name: api_base_url
      default: "http://localhost:8000"
      description: Basis-URL der Backend-API.

composition:
  uses:
    login: "@org/login-screen@^0.1"
    search: "@org/search-bar@^0.1"
    note: "@org/text-input@^0.1"
    contact: "@org/contact-form@^0.1"
  tree:
    - node: login
    - node: search
      props:
        placeholder: "Wonach suchst du?"
    - node: note
      props:
        value: Speccify
        placeholder: "Wie heißt du?"
    - node: contact
  wiring:
    # Nach erfolgreichem Login geht es zur Suche.
    - when: login.login_succeeded
      navigate: /suche
    # Eine Suche führt weiter zum Notiz-Screen.
    - when: search.submitted
      navigate: /notiz
    # Die Notiz landet als Vorbelegung im Kontaktformular …
    - when: note.submitted
      set: contact.initial_name
      to: payload.value
    # … und schickt den Nutzer gleich dorthin (Datenfluss über Screens).
    - when: note.submitted
      navigate: /kontakt

acceptance:
  - given: Nutzer ist auf /
    when: login_succeeded wird emittiert
    then: die App zeigt /suche
  - given: Nutzer bestätigt die Notiz auf /notiz
    then: die App zeigt /kontakt mit der Notiz als initial_name
