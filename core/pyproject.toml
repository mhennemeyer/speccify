[project]
name = "flowcation-core"
version = "0.0.0"
description = "Flowcation core — shared spec loader, schema validator, resolver, codegen pipeline."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Marc Hennemeyer" }]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowcation_core"]
