[project]
name = "speccify-core"
version = "0.0.0"
description = "Speccify core — shared spec loader, schema validator, resolver, codegen pipeline."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Marc Hennemeyer" }]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Live-Bedrock-Pfad nur für Maintainer (`scripts/record_llm_cache.py`); CI
# läuft offline gegen den Replay-Cache und braucht das SDK nicht.
bedrock = ["boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speccify_core"]
