[project]
name = "speccify-core"
version = "0.0.0"
description = "Speccify core — shared spec loader, schema validator, resolver, codegen pipeline."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Marc Hennemeyer" }]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Live-Anthropic-Pfad nur für Maintainer (`scripts/record_llm_cache.py`); CI
# läuft offline gegen den Replay-Cache und braucht das SDK nicht.
anthropic = ["anthropic>=0.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speccify_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/speccify_core/codegen/templates/stub.md.j2" = "speccify_core/codegen/templates/stub.md.j2"
"src/speccify_core/codegen/templates/react_llm.prompt.j2" = "speccify_core/codegen/templates/react_llm.prompt.j2"
