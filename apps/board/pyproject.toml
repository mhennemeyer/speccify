[project]
name = "speccify-board"
version = "0.0.0"
description = "Speccify Web-Board — one service that reads, shows and updates the spec registers of any number of repositories (Spec 032)."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Matthias Hennemeyer" }]
dependencies = [
    "speccify-core",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pyyaml>=6.0",
    "mcp>=1.27.1,<2.0",
]

[project.scripts]
speccify-board = "speccify_board.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speccify_board"]
