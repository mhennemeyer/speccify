# Example: one board for a team. Copy board.example.yaml to board.yaml,
# list your repositories, then `docker compose up -d` and open
# http://localhost:8790/. Private repos: put a token in the environment
# (`GIT_TOKEN`, referenced as ${GIT_TOKEN} in board.yaml) or mount an SSH key.
services:
  board:
    build:
      context: ../..
      dockerfile: apps/board/Dockerfile
    image: speccify-board
    ports:
      - "8790:8790"
    environment:
      GIT_TOKEN: ${GIT_TOKEN:-}
      BOARD_PASSWORD: ${BOARD_PASSWORD:-}
      BOARD_MCP_TOKEN: ${BOARD_MCP_TOKEN:-}
    volumes:
      - ./board.yaml:/config/board.yaml:ro
      - board-data:/data
      # - ~/.ssh/id_ed25519:/home/board/.ssh/id_ed25519:ro
      # - /work/projekte:/projects:ro   # for `path:` entries
    restart: unless-stopped

volumes:
  board-data:
