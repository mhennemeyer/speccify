[project]
name = "speccify-web-backend"
version = "0.0.0"
description = "Speccify web playground backend — thin FastAPI adapter over speccify-core."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Marc Hennemeyer" }]
dependencies = [
    "speccify-core",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
speccify-web-backend = "speccify_web_backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speccify_web_backend"]
