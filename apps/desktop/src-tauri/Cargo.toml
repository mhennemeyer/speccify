# Übernommen aus dotagent app/dashboard (Plan desktop-app-und-composer.md, A0).
# Member des Root-Cargo-Workspace; bewusst edition 2021 (unveränderter Umzug).

[package]
name = "speccify-desktop"
version = "0.3.0"
description = "Speccify-Desktop-App (Tauri 2): Library/Umgebung/Server/Knowledgebases + Prozess-Supervisor."
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "speccify_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shell-words = "1.1"
time = { version = "0.3", features = ["formatting"] }
toml = "0.8"
portable-pty = "0.9"
wait-timeout = "0.2"
speccify-mcp-core = { path = "../../../crates/mcp-core" }
speccify-toolbox = { path = "../../../crates/toolbox" }
tauri-plugin-updater = "2.10.1"
