      window.__TAURI_INTERNALS__ = {
        metadata: {
          currentWindow: { label: "project-mock" },
          currentWebview: { label: "project-mock", windowLabel: "project-mock" },
        },
        transformCallback(callback) {
          const id = ++callbackId;
          window[`_${id}`] = callback;
          return id;
        },
        convertFileSrc: (path) => path,
        invoke(cmd, args) {
          const fn = responses[cmd];
          console.log("[mock invoke]", cmd);
          if (!fn) return Promise.reject(`mock: unbekanntes Kommando ${cmd}`);
          return Promise.resolve(fn(args));
        },
