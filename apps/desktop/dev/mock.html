          if (event.startsWith("action-") && mode === "delayed") return new Promise((resolve) => {
            setTimeout(() => { eventListeners.set(id, { event, handler }); resolve(id); }, 1000);
          });
          eventListeners.set(id, { event, handler });
          return id;
        },
        "plugin:event|unlisten": ({ eventId }) => { eventListeners.delete(eventId); return null; },
      };
      let callbackId = 0;
      if (marketing) installMarketingFixture({ responses, tickets, base, gitState, branchState, emit });
      if (new URLSearchParams(location.search).has("workspaces")) installWorkspaceFixture(responses);
      window.__TAURI_INTERNALS__ = {
        // ?dashboard=1 → Hauptfenster (Label "main") statt Projektfenster.
        metadata: (() => {
          const label = new URLSearchParams(location.search).has("dashboard") ? "main" : "project-mock";
          return {
            currentWindow: { label },
            currentWebview: { label, windowLabel: label },
          };
        })(),
        transformCallback(callback) {
          const id = ++callbackId;
          window[`_${id}`] = callback;
          return id;
        },
        convertFileSrc: (path) => path,
        invoke(cmd, args) {
          const fn = responses[cmd];
          console.log("[mock invoke]", cmd, cmd === "terminal_open" ? JSON.stringify(args) : "");
          if (!fn) return Promise.reject(`mock: unbekanntes Kommando ${cmd}`);
          return Promise.resolve(fn(args ?? {})).then(value => structuredClone(value));
        },
      };
      await import("/src/main.tsx");
    </script>
