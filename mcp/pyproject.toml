[project]
name = "speccify-mcp"
version = "0.0.0"
description = "Speccify MCP server — exposes resolve/search/render/validate to coding agents."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Matthias Hennemeyer" }]
dependencies = [
    "speccify-core",
    "speccify-cli",
    "mcp[cli]>=1.27.1,<2.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
speccify-mcp = "speccify_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speccify_mcp"]
