[project]
name = "speccify-mcp"
version = "0.0.0"
description = "Speccify MCP server — exposes resolve/search/render/validate to coding agents."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Marc Hennemeyer" }]
dependencies = ["speccify-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speccify_mcp"]
