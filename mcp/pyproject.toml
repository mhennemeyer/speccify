[project]
name = "flowcation-mcp"
version = "0.0.0"
description = "Flowcation MCP server — exposes resolve/search/render/validate to coding agents."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Marc Hennemeyer" }]
dependencies = ["flowcation-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowcation_mcp"]
