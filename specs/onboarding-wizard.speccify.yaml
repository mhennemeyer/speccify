schema_version: 1
id: spec://onboarding-wizard
version: 0.1.0
kind: workflow
title: Onboarding-Wizard
summary: >
  Mehrstufiger Onboarding-Workflow: Begrüßung → Profil-Daten (Kontaktformular)
  → Bestätigung. Erlaubt Zurück-Navigation und persistiert Zwischenstände.
authors: [marc@speccify.io]
license: MIT

uses:
  - spec://button@^0.1
  - spec://contact-form@^0.1

api:
  props:
    - name: resume_token
      type: string
    - name: total_steps
      type: integer
      default: 3
      constraints: ["min=2", "max=10"]
  outputs:
    - name: onboarding_result
      type: "object{profile: object, completed_at: string}"
  events:
    - name: step_changed
      payload:
        from: integer
        to: integer
    - name: completed
      payload:
        profile: object
    - name: abandoned
      payload:
        last_step: integer

acceptance:
  - given: Wizard startet ohne resume_token
    then: Schritt 1 (Begrüßung) wird angezeigt; step_changed nicht emittiert
  - given: Schritt 2 (Profilformular) ist gültig
    when: Nutzer drückt Weiter
    then: step_changed from=2 to=3 wird emittiert
  - given: Nutzer drückt Zurück auf Schritt 3
    then: step_changed from=3 to=2; Formulardaten bleiben erhalten
  - given: Nutzer schließt App auf Schritt 2
    then: abandoned mit last_step=2; Zwischenstand persistiert für 24h

ux:
  references:
    - ./screenshots/wizard-step1.png
    - ./screenshots/wizard-step2.png
    - ./screenshots/wizard-step3.png
  a11y: WCAG-2.2-AA
  i18n: required

non_functional:
  performance: "Schritt-Übergang < 200ms"
  security:
    - "Zwischenstände verschlüsselt persistieren"
