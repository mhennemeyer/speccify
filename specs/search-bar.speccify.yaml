schema_version: 1
id: spec://search-bar
version: 0.1.0
kind: ui-component
title: Search-Bar
summary: >
  Composite-Komponente aus Text-Input und Button: Nutzer tippt eine Suchanfrage
  und löst sie per Enter oder Button-Klick aus. Erste Referenz-Spec für den
  composition-Block (P2) — Verdrahtung typgeprüft gegen die Kind-APIs.
authors: [marc@speccify.io]
license: MIT

api:
  props:
    - name: placeholder
      type: string
      default: "Suchen…"
      map_to: query_input.placeholder
    - name: busy
      type: boolean
      default: false
      map_to: go_button.loading
      description: Zeigt laufende Suche am Button an.
  events:
    - name: submitted
      payload:
        query: string

composition:
  uses:
    query_input: spec://text-input@^0.1
    go_button: spec://button@^0.1
  tree:
    - node: query_input
    - node: go_button
      props:
        label: Suchen
        variant: primary
  wiring:
    # Kontrollierter Wert: jede Eingabe fließt zurück in die value-Prop.
    - when: query_input.changed
      set: query_input.value
      to: payload.value
    # Enter im Feld löst die Suche mit dem Event-Payload aus.
    - when: query_input.submitted
      emit: submitted
      with:
        query: payload.value
    # Button-Klick löst die Suche mit dem aktuellen Feldwert aus.
    - when: go_button.pressed
      emit: submitted
      with:
        query: props.query_input.value

acceptance:
  - given: Feld enthält "speccify"
    when: Nutzer drückt Enter
    then: submitted-Event mit query="speccify" wird genau einmal emittiert
  - given: Feld enthält "speccify"
    when: Nutzer klickt den Such-Button
    then: submitted-Event mit query="speccify" wird genau einmal emittiert
  - given: busy=true
    then: Button zeigt Loading-State; submitted wird nicht emittiert

ux:
  a11y: WCAG-2.2-AA
  i18n: required
