<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spec 062 · Container-Terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<style>
  :root { color-scheme: dark; --bg:#14161a; --panel:#1d2026; --line:#2c313a; --text:#d7dae0; --dim:#8b93a1; --accent:#6aa9ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr; }
  /* Fixed height: a wrapping header changed the terminal by one row per attach (SIGWINCH). */
  header { display: flex; flex-wrap: nowrap; overflow: hidden; white-space: nowrap; height: 44px; gap: 6px; align-items: center; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  input, select, button { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; font: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  input.missing { border-color: #e5534b; box-shadow: 0 0 0 2px rgba(229, 83, 75, .35); }
  #status { margin-left: auto; color: var(--dim); }
  #status.on { color: #7fd48a; }
  main { display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
  #term { min-width: 0; min-height: 0; padding: 6px; }
  aside { border-left: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: auto 1fr auto 1fr; min-height: 0; }
  aside h2 { margin: 0; padding: 8px 10px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  #sessions, #events { overflow: auto; padding: 0 10px 8px; margin: 0; list-style: none; font-size: 12px; }
  #sessions li { padding: 4px 0; border-bottom: 1px solid var(--line); cursor: pointer; word-break: break-all; }
  #sessions li.active { color: var(--accent); }
  #events li { padding: 2px 0; color: var(--dim); word-break: break-word; }
</style>
</head>
<body>
<header>
  <input id="token" type="password" placeholder="Token" size="18" autocomplete="off">
  <input id="command" placeholder="Startkommando (leer = Shell)" size="26">
  <button id="create">Neue Sitzung</button>
  <select id="replay" title="Replay beim Verbinden">
    <option value="ring">Replay: Ringpuffer</option>
    <option value="vt">Replay: Bildschirmzustand</option>
    <option value="none">Replay: keins</option>
  </select>
  <button id="detach">Trennen</button>
  <button id="handover" title="Mehrzeiliger Auftrag als Bracketed Paste, ohne Enter">Auftrag einfügen</button>
  <button id="kill">Sitzung beenden</button>
  <span id="status">getrennt</span>
</header>
<main>
  <div id="term"></div>
  <aside>
    <h2>Sitzungen</h2>
    <ul id="sessions"></ul>
    <h2>Ereignisse</h2>
    <ul id="events"></ul>
  </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.hash.slice(1));
const state = { ws: null, session: params.get("session"), manual: false, retry: null, attaches: 0, replaying: false, discarded: [] };

$("token").value = params.get("token") || sessionStorage.getItem("spike-token") || "";
$("replay").value = params.get("replay") || "ring";

const term = new Terminal({
  fontFamily: "Menlo, monospace", fontSize: 13, scrollback: 5000, allowProposedApi: true, cursorBlink: true,
  // OSC 8 hyperlinks: Claude Code marks its hard-wrapped login URL as one link.
  // xterm's default handler asks via confirm(); open directly instead.
  linkHandler: { activate: (event, uri) => { logEvent("OSC-8-Link geöffnet (" + uri.length + " Zeichen)"); window.open(uri, "_blank", "noopener"); } },
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.loadAddon(new WebLinksAddon.WebLinksAddon((event, uri) => { logEvent("Link geöffnet: " + uri); window.open(uri, "_blank", "noopener"); }));
term.open($("term"));
fit.fit();

function logEvent(text) {
  const li = document.createElement("li");
  li.textContent = new Date().toLocaleTimeString() + " · " + text;
  $("events").prepend(li);
}
function token() {
  const value = $("token").value.trim();
  sessionStorage.setItem("spike-token", value);
  return value;
}
function rememberHash() {
  const next = new URLSearchParams();
  if (state.session) next.set("session", state.session);
  next.set("replay", $("replay").value);
  history.replaceState(null, "", "#" + next.toString());
}
async function api(method, path, body) {
  const response = await fetch(path, {
    method,
    headers: { Authorization: "Bearer " + token(), "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!response.ok) throw new Error(method + " " + path + " → " + response.status);
  return response.status === 204 ? null : response.json();
}
// Without a valid token nothing works; say so where the person is looking.
function showTokenHint(reason) {
  if (state.hinted === reason) return;
  state.hinted = reason;
  $("token").classList.add("missing");
  if (state.ws) return;
  term.reset();
  term.writeln("\x1b[1;33m" + reason + "\x1b[0m");
  term.writeln("");
  term.writeln("Im Ordner experiments/remote-terminal:");
  term.writeln("  \x1b[36m./run.sh open\x1b[0m    öffnet diese Seite mit Token");
  term.writeln("  \x1b[36m./run.sh token\x1b[0m   zeigt den Token zum Einfügen oben links (dann Enter)");
}
function clearTokenHint() {
  $("token").classList.remove("missing");
  if (!state.hinted) return;
  state.hinted = null;
  if (!state.ws) { term.reset(); term.writeln("Token angenommen. \x1b[36mNeue Sitzung\x1b[0m startet eine Shell im Container."); }
}
async function refreshSessions() {
  let list = [];
  if (!token()) { showTokenHint("Kein Token – der Server lehnt alles ab."); return; }
  try { list = await api("GET", "/api/sessions"); clearTokenHint(); }
  catch (error) {
    if (String(error.message).endsWith("401")) showTokenHint("Token falsch – der Server antwortet mit 401.");
    else logEvent(String(error.message));
  }
  $("sessions").replaceChildren(...list.map((s) => {
    const li = document.createElement("li");
    li.className = s.id === state.session ? "active" : "";
    li.textContent = `${s.id.slice(0, 13)}… ${s.command || "shell"} · ${s.viewers} Betrachter · ${Math.round(s.ring_bytes / 1024)} KiB${s.ring_dropped ? " (−" + Math.round(s.ring_dropped / 1024) + ")" : ""}${s.exited ? " · beendet" : ""}`;
    li.onclick = () => attach(s.id);
    return li;
  }));
}
function send(message) {
  if (state.ws && state.ws.readyState === WebSocket.OPEN) state.ws.send(JSON.stringify(message));
}
function setStatus(text, on) {
  $("status").textContent = text;
  $("status").className = on ? "on" : "";
}
function attach(id) {
  detach(true);
  state.session = id;
  state.manual = false;
  rememberHash();
  // The server owns the screen: start from nothing and let the replay paint it.
  term.reset();
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  const url = `${scheme}://${location.host}/ws/${id}?token=${encodeURIComponent(token())}&replay=${$("replay").value}`;
  const ws = new WebSocket(url);
  ws.binaryType = "arraybuffer";
  state.ws = ws;
  ws.onopen = () => {
    state.attaches += 1;
    setStatus("verbunden · " + id.slice(0, 13) + "…", true);
    send({ type: "resize", cols: term.cols, rows: term.rows });
    refreshSessions();
    term.focus();
  };
  ws.onmessage = (event) => {
    if (typeof event.data === "string") {
      // Replay announced: until it is painted, whatever the terminal "types" is an
      // answer to an old query inside the replay and must not reach the program.
      const message = JSON.parse(event.data);
      if (message.type === "replay" && message.bytes > 0) state.replaying = true;
      return;
    }
    const bytes = new Uint8Array(event.data);
    if (state.replaying) term.write(bytes, () => { state.replaying = false; });
    else term.write(bytes);
  };
  ws.onclose = () => {
    if (state.ws !== ws) return;
    state.ws = null;
    setStatus(state.manual ? "getrennt" : "Verbindung verloren – neuer Versuch …", false);
    if (!state.manual) state.retry = setTimeout(() => attach(id), 1000);
  };
}
function detach(silent) {
  clearTimeout(state.retry);
  state.manual = true;
  if (state.ws) { const ws = state.ws; state.ws = null; ws.close(); }
  if (!silent) setStatus("getrennt", false);
}

term.onData((data) => {
  if (state.replaying) { state.discarded.push(data); return; }
  send({ type: "input", data });
});
term.onBell(() => logEvent("Bell"));
term.parser.registerOscHandler(9, (data) => { logEvent("OSC 9: " + data); return true; });
term.parser.registerOscHandler(777, (data) => { logEvent("OSC 777: " + data); return true; });
// OSC 52: the program in the container copies to *its* clipboard — which is ours.
// Claude Code's "c to copy" on the login screen arrives here with the full URL.
term.parser.registerOscHandler(52, (data) => {
  if (state.replaying) return true; // never re-copy something from the past
  const base64 = data.slice(data.indexOf(";") + 1);
  let text = "";
  try { text = new TextDecoder().decode(Uint8Array.from(atob(base64), (c) => c.charCodeAt(0))); } catch (error) { return true; }
  navigator.clipboard.writeText(text).then(
    () => logEvent("OSC 52 → Zwischenablage (" + text.length + " Zeichen)"),
    (error) => logEvent("OSC 52 abgelehnt: " + error.message),
  );
  return true;
});
term.onTitleChange((title) => logEvent("Titel: " + title));
// Same contract as TerminalPanel.tsx: Shift+Enter reaches the agent as CSI-u.
term.attachCustomKeyEventHandler((event) => {
  if (event.type === "keydown" && event.key === "Enter" && event.shiftKey) {
    send({ type: "input", data: "\x1b[13;2u" });
    return false;
  }
  return true;
});
new ResizeObserver(() => { fit.fit(); send({ type: "resize", cols: term.cols, rows: term.rows }); }).observe($("term"));

$("token").onchange = () => { state.hinted = "recheck"; refreshSessions(); };
$("create").onclick = async () => {
  if (!token()) { state.hinted = null; showTokenHint("Kein Token – der Server lehnt alles ab."); $("token").focus(); return; }
  try {
    const created = await api("POST", "/api/sessions", { cols: term.cols, rows: term.rows, command: $("command").value });
    attach(created.id);
  } catch (error) { logEvent(String(error.message)); }
};
$("detach").onclick = () => detach(false);
$("replay").onchange = rememberHash;
$("kill").onclick = async () => {
  if (!state.session) return;
  const id = state.session;
  detach(false);
  try { await api("DELETE", "/api/sessions/" + id); } catch (error) { logEvent(String(error.message)); }
  state.session = null;
  rememberHash();
  refreshSessions();
};
$("handover").onclick = () => {
  const order = "Arbeite Spec 062 ab.\nZeile zwei des Auftrags.\nZeile drei – Enter bleibt beim Menschen.";
  send({ type: "input", data: "\x1b[200~" + order + "\x1b[201~" });
  logEvent("Auftrag als Bracketed Paste übergeben (ohne Enter)");
  term.focus();
};

// For scripted checks (Playwright): the visible screen as text.
window.spike = {
  term, state,
  screen() {
    const buffer = term.buffer.active, rows = [];
    for (let y = 0; y < term.rows; y++) rows.push(buffer.getLine(buffer.viewportY + y)?.translateToString(true) ?? "");
    return { type: buffer.type, cursor: [buffer.cursorX, buffer.cursorY], text: rows.join("\n") };
  },
};

refreshSessions();
setInterval(refreshSessions, 5000);
if (state.session && token()) attach(state.session);
</script>
</body>
</html>
