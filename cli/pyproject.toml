[project]
name = "flowcation-cli"
version = "0.0.0"
description = "Flowcation CLI — `flowcation` command (init, add, pull, lock, verify, publish, lint)."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Marc Hennemeyer" }]
dependencies = ["flowcation-core"]

# [project.scripts] flowcation = "flowcation_cli.__main__:main"  # Phase 0: noch keine main()

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowcation_cli"]
