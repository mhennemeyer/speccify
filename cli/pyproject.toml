[project]
name = "speccify-cli"
version = "0.0.0"
description = "Speccify CLI — `speccify` command (init, add, pull, lock, verify, publish, lint)."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Marc Hennemeyer" }]
dependencies = [
    "speccify-core",
    "typer>=0.12",
]

[project.scripts]
speccify = "speccify_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speccify_cli"]
