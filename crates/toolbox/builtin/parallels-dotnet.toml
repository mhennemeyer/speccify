kind        = "mcp"
name        = "Parallels-MCP (.NET in Windows-VM)"
slug        = "parallels-dotnet"
description = ".NET-Workflows in der Parallels-Windows-VM (prlctl exec, eigene Allowlist; Streamable HTTP, 127.0.0.1:8766)."
tags        = ["parallels", "dotnet", "vm"]
category    = "Agent-Infrastruktur"

# Rust-Port (crates/parallels-mcp); braucht --project (Home-Share-Basis).
[run]
command   = "speccify-parallels-mcp"
args      = ["--port", "8766"]
transport = "http"
autostart = false

[requires]
binaries = ["speccify-parallels-mcp", "prlctl"]
