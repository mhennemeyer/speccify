kind        = "mcp"
name        = "Exec-MCP"
slug        = "speccify-exec"
description = "Führt Allowlist-geprüfte CLI-Befehle projektgebunden aus (Streamable HTTP, 127.0.0.1:8765). Vertrag: docs/exec-mcp-contract.md."
tags        = ["exec", "allowlist", "agents"]
category    = "Agent-Infrastruktur"

# Rust-Port (crates/exec-mcp), wire-identisch zur dotagent-Referenz —
# Kontrakt-Diff-Harness 28/28 grün (Plan T4, docs/exec-mcp-contract.md).
[run]
command   = "speccify-exec-mcp"
args      = ["--port", "8765"]
transport = "http"
autostart = false

[requires]
binaries = ["speccify-exec-mcp"]
