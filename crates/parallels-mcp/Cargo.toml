[package]
name = "speccify-parallels-mcp"
description = ".NET-Workflows in einer Parallels-Windows-VM (prlctl exec, eigene Allowlist). Rust-Port der dotagent-Referenz (Streamable HTTP :8766 + stdio)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde_json = "1"
shlex = "1"
wait-timeout = "0.2"
speccify-mcp-core = { path = "../mcp-core" }

[[bin]]
name = "speccify-parallels-mcp"
path = "src/main.rs"
