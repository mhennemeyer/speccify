[package]
name = "speccify-discovery-mcp"
description = "Discovery-MCP: bietet Agents alle MCPs (mit Client-Config) und Tools/Aktionen an — mcp_list, tools_list, actions_propose, scaffold (Streamable HTTP :8767 + stdio)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde_json = "1"
speccify-mcp-core = { path = "../mcp-core" }
speccify-toolbox = { path = "../toolbox" }

[[bin]]
name = "speccify-discovery-mcp"
path = "src/main.rs"
