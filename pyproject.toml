[project]
name = "speccify-workspace"
version = "0.0.0"
description = "Speccify monorepo workspace — Spec-First component platform for AI agents."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Marc Hennemeyer" }]

[project.optional-dependencies]
# Spiegelt `speccify-core[bedrock]` auf Workspace-Ebene, damit der im
# Phasen-Plan dokumentierte Aufruf `uv sync --extra bedrock` (am Repo-Root)
# funktioniert. CI installiert das Extra nicht; nur Maintainer brauchen es
# für `scripts/record_llm_cache.py` (AWS-Bedrock-Live-Aufnahme).
bedrock = ["speccify-core[bedrock]"]

[tool.uv.workspace]
members = ["core", "cli", "mcp", "apps/web/backend"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
    "speccify-core",
    "speccify-cli",
    "speccify-mcp",
    "speccify-web-backend",
]

[tool.uv.sources]
speccify-core = { workspace = true }
speccify-cli = { workspace = true }
speccify-mcp = { workspace = true }
speccify-web-backend = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["core", "cli", "mcp", "apps/web/backend"]
addopts = "-q"
