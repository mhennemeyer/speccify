[project]
name = "speccify-workspace"
version = "0.0.0"
description = "Speccify monorepo workspace — playbooks for complex, recurring workflows."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Matthias Hennemeyer" }]

[tool.uv.workspace]
members = ["core", "cli", "mcp", "apps/web/backend"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
    "speccify-core",
    "speccify-cli",
    "speccify-mcp",
    "speccify-web-backend",
]

[tool.uv.sources]
speccify-core = { workspace = true }
speccify-cli = { workspace = true }
speccify-mcp = { workspace = true }
speccify-web-backend = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["core", "cli", "mcp", "apps/web/backend", "tests"]
# Link checks need the network and are opt-in: `pytest -m links`.
addopts = "-q -m \"not links\""
markers = [
    "links: checks that playbook source URLs still resolve (needs network)",
]
